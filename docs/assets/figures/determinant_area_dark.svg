<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" role="img"><title>The unit square mapped by A: its area scales by det A, and collapses to a line when det A = 0</title><style>
    .text {fill:#e2e4e9} .muted {fill:#9aa0ab}
    .axis {stroke:#9aa0ab; stroke-width:1.4; fill:none}
    .edge {stroke:#9aa0ab; stroke-width:1.5}
    .guide {stroke:#9aa0ab; stroke-width:1.2; stroke-dasharray:5 4; fill:none}
    .fill-p {fill:#8c9eff; fill-opacity:0.18} .fill-a {fill:#ffab40; fill-opacity:0.18}
    .shade-p {fill:#8c9eff; fill-opacity:0.07} .shade-a {fill:#ffab40; fill-opacity:0.07}
    .line-t {stroke:#e2e4e9; stroke-width:2.2; fill:none}
    .line-p {stroke:#8c9eff; stroke-width:2.4; fill:none}
    .line-a {stroke:#ffab40; stroke-width:2.4; fill:none}
    .line-m {stroke:#9aa0ab; stroke-width:1.6; fill:none}
    .thin-p {stroke:#8c9eff; stroke-width:1.6; fill:none}
    .thin-a {stroke:#ffab40; stroke-width:1.6; fill:none}
    .dash-p {stroke:#8c9eff; stroke-width:2; stroke-dasharray:6 4; fill:none}
    .dash-a {stroke:#ffab40; stroke-width:2; stroke-dasharray:6 4; fill:none}
    .dot {fill:#e2e4e9} .dot-p {fill:#8c9eff} .dot-a {fill:#ffab40} .dot-m {fill:#9aa0ab}
    .faint {opacity:0.35} .bg {fill:#1e2029}
</style><defs><marker id="head-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2e4e9"/></marker><marker id="head-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c9eff"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffab40"/></marker><marker id="head-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0ab"/></marker></defs><line x1="50.0" y1="320.0" x2="220.0" y2="320.0" class="axis" />
