<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" role="img"><title>Dot product as an angle and projection; cross product perpendicular to both vectors</title><style>
    .text {fill:#222} .muted {fill:#666}
    .axis {stroke:#666; stroke-width:1.4; fill:none}
    .edge {stroke:#666; stroke-width:1.5}
    .guide {stroke:#666; stroke-width:1.2; stroke-dasharray:5 4; fill:none}
    .fill-p {fill:#3f51b5; fill-opacity:0.18} .fill-a {fill:#e65100; fill-opacity:0.18}
    .shade-p {fill:#3f51b5; fill-opacity:0.07} .shade-a {fill:#e65100; fill-opacity:0.07}
    .line-t {stroke:#222; stroke-width:2.2; fill:none}
    .line-p {stroke:#3f51b5; stroke-width:2.4; fill:none}
    .line-a {stroke:#e65100; stroke-width:2.4; fill:none}
    .line-m {stroke:#666; stroke-width:1.6; fill:none}
    .thin-p {stroke:#3f51b5; stroke-width:1.6; fill:none}
    .thin-a {stroke:#e65100; stroke-width:1.6; fill:none}
    .dash-p {stroke:#3f51b5; stroke-width:2; stroke-dasharray:6 4; fill:none}
    .dash-a {stroke:#e65100; stroke-width:2; stroke-dasharray:6 4; fill:none}
    .dotted-a {stroke:#e65100; stroke-width:2.2; stroke-dasharray:0.1 5; stroke-linecap:round; fill:none}
    .dot {fill:#222} .dot-p {fill:#3f51b5} .dot-a {fill:#e65100} .dot-m {fill:#666}
    .faint {opacity:0.35} .bg {fill:#ffffff}
</style><defs><marker id="head-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker><marker id="head-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f51b5"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e65100"/></marker><marker id="head-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker></defs><line x1="166.4" y1="115.1" x2="166.4" y2="230.0" class="guide" />
<line x1="70.0" y1="242.0" x2="166.4" y2="242.0" class="line-m" stroke-width="1.2"/>
<text x="118.2" y="260.0" font-size="13" text-anchor="middle" class="muted">|b| cos θ</text>
<line x1="70.0" y1="230.0" x2="300.0" y2="230.0" class="line-p" marker-end="url(#head-p)" />
<line x1="70.0" y1="230.0" x2="166.4" y2="115.1" class="line-a" marker-end="url(#head-a)" />
<path d="M106,230 A36,36 0 0 0 93.1,202.4" class="line-m" />
<text x="114.0" y="216.0" font-size="15" text-anchor="start" class="text" font-style="italic">θ</text>
<text x="308.0" y="235.0" font-size="16" text-anchor="start" class="text" font-style="italic" font-weight="bold">a</text>
<text x="172.4" y="109.1" font-size="16" text-anchor="start" class="text" font-style="italic" font-weight="bold">b</text>
<text x="70.0" y="44.0" font-size="15" text-anchor="start" class="text" font-style="italic">a · b = |a| |b| cos θ</text>
<text x="70.0" y="64.0" font-size="13" text-anchor="start" class="muted">zero when a and b are perpendicular</text>
<polygon points="510.0,230.0 650.0,230.0 710.0,175.0 570.0,175.0" class="fill-p"/>
<line x1="510.0" y1="230.0" x2="650.0" y2="230.0" class="line-p" marker-end="url(#head-p)" />
<line x1="510.0" y1="230.0" x2="570.0" y2="175.0" class="line-a" marker-end="url(#head-a)" />
<line x1="510.0" y1="230.0" x2="510.0" y2="80.0" class="line-t" marker-end="url(#head-t)" />
<path d="M510,216 L522,216 L522,230" class="line-m" stroke-width="1.2"/>
<text x="658.0" y="235.0" font-size="16" text-anchor="start" class="text" font-style="italic" font-weight="bold">a</text>
<text x="574.0" y="169.0" font-size="16" text-anchor="start" class="text" font-style="italic" font-weight="bold">b</text>
<text x="520.0" y="92.0" font-size="16" text-anchor="start" class="text" font-style="italic" font-weight="bold">a × b</text>
<text x="430.0" y="268.0" font-size="13" text-anchor="start" class="muted">|a × b| = |a| |b| sin θ, the shaded area</text>
<text x="430.0" y="44.0" font-size="15" text-anchor="start" class="text">a × b is perpendicular to a and b</text>
<text x="430.0" y="64.0" font-size="13" text-anchor="start" class="muted">right-hand rule: curl fingers from a to b</text></svg>
