site_name: Controls Crash Course
site_description: An interactive control theory crash course for software engineers.
repo_url: https://github.com/cdebuys/controls-crash-course

theme:
  name: material
  # Note: don't enable the `navigation.instant` feature without reworking the
  # page widgets; instant loading swaps page content without re-running inline scripts.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - 0. Math Toolkit:
      - Complex Numbers: math/complex_numbers.md
      - Vectors and Matrices: math/vectors_matrices.md
      - Solving Linear Systems: math/linear_systems.md
      - Eigenvalues and Eigenvectors: math/eigenvalues.md
      - Derivatives and Integrals: math/derivatives_integrals.md
      - Differential Equations: math/differential_equations.md
      - Partial Derivatives and Jacobians: math/jacobians.md
      - Quadratic Forms and Optimization: math/optimization.md
  - 1. Time Domain:
      - Dynamic Systems: time_domain.md
      - State Space, Stability, and Linearization: state_space.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js
